<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EcoSetu – Formalising India's E-Waste Economy">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EcoSetu">
  <link rel="apple-touch-icon" href="assets/assets/images/logo.png">
  <link rel="icon" type="image/png" href="assets/assets/images/logo.png">
  <title>EcoSetu – Kabadiwala App</title>
  <link rel="manifest" href="manifest.json">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <style id="splash-screen-style">
    html { height: 100% }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0f172a;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #app-container {
      width: 100%;
      height: 100%;
      max-width: 430px;
      max-height: 932px;
      box-shadow: 0 0 50px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
      background: #ffffff;
    }
    .center {
      margin: 0; position: absolute;
      top: 50%; left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }
    .contain { display:block; width:100%; height:100%; object-fit:contain; }
    .stretch { display:block; width:100%; height:100%; }
    .cover   { display:block; width:100%; height:100%; object-fit:cover; }
    .bottom  { position:absolute; bottom:0; left:50%; -ms-transform:translate(-50%,0); transform:translate(-50%,0); }
    .bottomLeft  { position:absolute; bottom:0; left:0; }
    .bottomRight { position:absolute; bottom:0; right:0; }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <div id="app-container">
    <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
    </picture>
  </div>

  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>
