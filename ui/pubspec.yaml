name: ecosetu
description: EcoSetu - Kabadiwala Connect recycling companion app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0
  shimmer: ^4.0.0
  connectivity_plus: ^7.3.1
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  intl: ^0.20.3
  url_launcher: ^6.3.2
  supabase_flutter: ^2.17.2
  flutter_image_compress: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/hero_combined.png
    - assets/images/materials/
    - assets/images/hero_visual.png
    - assets/images/hero_visual_final.png
    - assets/images/safety/
    - assets/images/recycler_center.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logo.png"
  android: true
  ios: true
